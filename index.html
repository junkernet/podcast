<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff's Private Feed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        h1 { color: #ff6b35; }
        a { color: #4ecdc4; }
        .feed-url {
            background: #16213e;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
        }
        .episode {
            border-bottom: 1px solid #333;
            padding: 12px 0;
        }
    </style>
</head>
<body>
    <h1>🎧 Jeff's Private Feed</h1>
    <p>Articles converted to audio, served as a private podcast.</p>
    <h2>Subscribe</h2>
    <p>Add this feed URL to your podcast app:</p>
    <div class="feed-url">https://jeffalldridge.github.io/jeff-podcast/feed.xml</div>
    <h2>Recent Episodes</h2>
    <div id="episodes">
        <p><em>Episodes will appear here after the feed is populated.</em></p>
    </div>
</body>
</html>
